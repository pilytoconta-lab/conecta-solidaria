<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntário - ConectaSolidária</title>
    <link rel="stylesheet" href="../style.css"> 
</head>

<body>

    <header>
        <h1>Seja um Voluntário</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos Sociais</a>
            <a href="cadastro.html">Seja Voluntário</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Cadastre-se para participar</h2>

            <p>
                Preencha o formulário abaixo para demonstrar
                seu interesse em participar dos nossos projetos.
            </p>

            <form>

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>

                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf"
                        placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        required>

                    <br><br>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone"
                        
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    
                        required>

                    <br><br>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                </fieldset>

                <br>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep"
                        placeholder="00000-000"
                        pattern="[0-9]{5}-[0-9]{3}"
                        required>

                    <br><br>

                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>

                    <br><br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>

                </fieldset>

                <br>

                <fieldset>
                    <legend>Participação</legend>

                    <label for="area">Área de interesse:</label>

                    <select id="area" name="area" required>
                        <option value="">Selecione uma opção</option>
                        <option value="educacao">Educação</option>
                        <option value="alimentacao">Alimentação</option>
                        <option value="agasalho">Campanha do Agasalho</option>
                    </select>

                    <br><br>

                    <label for="mensagem">Conte um pouco sobre você:</label>

                    <br>

                    <textarea id="mensagem" name="mensagem"
                        rows="5" cols="40"></textarea>

                </fieldset>

                <br>

                <button type="submit">Enviar cadastro</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 ConectaSolidária</p>
    </footer>


    <script>
        const cpf = document.getElementById("cpf");
        const telefone = document.getElementById("telefone");
        const cep = document.getElementById("cep");
    
        cpf.addEventListener("input", function () {
            let valor = cpf.value.replace(/\D/g, "");
    
            valor = valor.replace(/^(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
            valor = valor.replace(/\.(\d{3})(\d)/, ".$1-$2");
    
            cpf.value = valor.substring(0, 14);
        });
    
        telefone.addEventListener("input", function () {
            let valor = telefone.value.replace(/\D/g, "");
    
            valor = valor.replace(/^(\d{2})(\d)/, "($1) $2");
            valor = valor.replace(/(\d{5})(\d)/, "$1-$2");
    
            telefone.value = valor.substring(0, 15);
        });
    
        cep.addEventListener("input", function () {
            let valor = cep.value.replace(/\D/g, "");
    
            valor = valor.replace(/^(\d{5})(\d)/, "$1-$2");
    
            cep.value = valor.substring(0, 9);
        });
    </script>
    </body>

    </html>
